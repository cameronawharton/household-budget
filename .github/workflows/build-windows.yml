name: Build and publish Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "main.js"
      - "preload.js"
      - "updater.js"
      - "package.json"
      - "package-lock.json"
      - "release-notes.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        shell: bash
        run: |
          set -e
          node test/logic.test.js
          node test/updater.test.js
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish installer if the version is new
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $published = ""
          if (Test-Path latest.json) { $published = (Get-Content latest.json -Raw | ConvertFrom-Json).version }
          if ($version -eq $published) { Write-Host "Version $version is already published. Nothing to do."; exit 0 }
          $built = "dist/Household Budget Setup $version.exe"
          if (-not (Test-Path $built)) { throw "Installer not found: $built" }
          New-Item -ItemType Directory -Force download | Out-Null
          Get-ChildItem download/*.exe -ErrorAction SilentlyContinue | Remove-Item
          $versioned = "download/Household-Budget-Setup-$version.exe"
          Copy-Item $built $versioned
          Copy-Item $built "download/Household-Budget-Setup.exe"
          $sha = (Get-FileHash $versioned -Algorithm SHA256).Hash.ToLower()
          $notes = ""
          if (Test-Path release-notes.txt) { $notes = (Get-Content release-notes.txt -Raw).Trim() }
          $info = [ordered]@{
            version = $version
            url = "https://github.com/${{ github.repository }}/raw/main/$versioned"
            sha256 = $sha
            notes = $notes
          }
          $info | ConvertTo-Json | Set-Content -Encoding utf8NoBOM latest.json
          Get-Content latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download latest.json
          git commit -m "Publish installer $version [skip ci]"
          git push
